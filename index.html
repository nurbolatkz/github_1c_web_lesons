<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1C + React Lessons</title>
    <meta
      name="description"
      content="Step-by-step lessons for React frontends, Python bridge services, and 1C backends."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </div>
          <a class="brand-title" href="#lesson-00">1C + React</a>
          <span class="brand-section">Lessons</span>
        </div>

        <div class="top-actions">
          <a
            class="icon-button"
            href="https://github.com/nurbolatkz/github_1c_web_lesons"
            aria-label="Open GitHub repository"
            title="Open GitHub repository"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 .8a11.2 11.2 0 0 0-3.5 21.8c.6.1.8-.2.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1.6 2.8 3.4 2 .1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.3 11.3 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.4 5.8.4.4.8 1.1.8 2.2V22c0 .4.2.7.8.6A11.2 11.2 0 0 0 12 .8Z"
              />
            </svg>
          </a>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.7-5.7 1.4-1.4M4.9 19.1l1.4-1.4m0-11.4L4.9 4.9m14.2 14.2-1.4-1.4" />
              <circle cx="12" cy="12" r="4" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Course lessons">
        <div class="sidebar-inner">
          <section class="progress-card">
            <h2>Course lessons</h2>
            <p><span id="completed-count">3</span> of <span id="total-count">12</span> completed</p>
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </section>

          <nav id="lesson-nav" class="lesson-nav"></nav>

          <div class="stack-note">React + Python + 1C</div>
        </div>
      </aside>

      <main class="lesson-main">
        <article class="lesson-article" id="lesson-article" tabindex="-1"></article>
      </main>

      <aside class="toc-panel" aria-label="Current lesson sections">
        <div class="toc-block">
          <h2>On this page</h2>
          <nav id="toc-nav"></nav>
        </div>
        <div class="toc-block">
          <h2>You will need</h2>
          <ul id="need-list" class="need-list"></ul>
        </div>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
